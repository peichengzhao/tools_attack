name: Bug report
description: Report a reproducible code or documentation defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the command with secrets removed.
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, private endpoints, and sensitive data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed all credentials and private data from this report.
          required: true
        - label: I searched existing issues.
          required: true
