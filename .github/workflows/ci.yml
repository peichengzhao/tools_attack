name: repository-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Repository hygiene
        run: python scripts/check_repository.py

      - name: Reproducibility audit
        run: python experiments/aaai27_supplement/scripts/reproducibility_audit.py

      - name: Unit tests
        working-directory: experiments/aaai27_supplement
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q InjecAgent/src exp7 experiments/aaai27_supplement scripts
